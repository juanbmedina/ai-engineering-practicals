<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <!-- input names -->
  <text x="150" y="85" font-size="13" fill="#555" text-anchor="end">cart position</text>
  <text x="150" y="155" font-size="13" fill="#555" text-anchor="end">cart velocity</text>
  <text x="150" y="225" font-size="13" fill="#555" text-anchor="end">pole angle</text>
  <text x="150" y="295" font-size="13" fill="#555" text-anchor="end">angular velocity</text>

  <!-- input nodes -->
  <circle cx="195" cy="80" r="25" fill="#fff" stroke="#0b6e6e" stroke-width="2"/>
  <circle cx="195" cy="150" r="25" fill="#fff" stroke="#0b6e6e" stroke-width="2"/>
  <circle cx="195" cy="220" r="25" fill="#fff" stroke="#0b6e6e" stroke-width="2"/>
  <circle cx="195" cy="290" r="25" fill="#fff" stroke="#0b6e6e" stroke-width="2"/>
  <text x="195" y="88" font-size="21" font-style="italic" fill="#0b6e6e" text-anchor="middle">x</text>
  <text x="194" y="158" font-size="21" font-style="italic" fill="#0b6e6e" text-anchor="middle">x</text>
  <circle cx="196" cy="139" r="2.2" fill="#0b6e6e"/>
  <text x="195" y="228" font-size="21" font-style="italic" fill="#0b6e6e" text-anchor="middle">&#952;</text>
  <text x="194" y="298" font-size="21" font-style="italic" fill="#0b6e6e" text-anchor="middle">&#952;</text>
  <circle cx="197" cy="279" r="2.2" fill="#0b6e6e"/>

  <!-- connections -->
  <line x1="222" y1="80" x2="448" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="222" y1="150" x2="448" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="222" y1="220" x2="448" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="222" y1="290" x2="448" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="350" y="133" font-size="15" fill="#b03a2e" font-style="italic">w<tspan font-size="11" dy="4">1</tspan></text>
  <text x="350" y="163" font-size="15" fill="#b03a2e" font-style="italic">w<tspan font-size="11" dy="4">2</tspan></text>
  <text x="350" y="194" font-size="15" fill="#b03a2e" font-style="italic">w<tspan font-size="11" dy="4">3</tspan></text>
  <text x="350" y="224" font-size="15" fill="#b03a2e" font-style="italic">w<tspan font-size="11" dy="4">4</tspan></text>
  <text x="296" y="88" font-size="13" fill="#b03a2e" text-anchor="middle">weights</text>

  <!-- bias -->
  <circle cx="330" cy="330" r="22" fill="#fff" stroke="#b03a2e" stroke-width="2"/>
  <text x="330" y="337" font-size="19" font-style="italic" fill="#b03a2e" text-anchor="middle">b</text>
  <text x="300" y="337" font-size="13" fill="#b03a2e" text-anchor="end">bias</text>
  <line x1="349" y1="318" x2="458.9" y2="213.2" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- summation -->
  <circle cx="490" cy="185" r="42" fill="#fff" stroke="#2f3640" stroke-width="2"/>
  <text x="490" y="198" font-size="34" fill="#2f3640" text-anchor="middle">&#931;</text>
  <text x="490" y="117" font-size="13" fill="#555" text-anchor="middle">add everything</text>

  <!-- sum to activation -->
  <line x1="534" y1="185" x2="586" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="560" y="175" font-size="15" font-style="italic" fill="#2f3640" text-anchor="middle">u</text>

  <!-- activation -->
  <rect x="592" y="145" width="104" height="80" rx="4" fill="#fff" stroke="#2f3640" stroke-width="2"/>
  <line x1="644" y1="215" x2="644" y2="155" stroke="#c4c4c4" stroke-width="1"/>
  <line x1="602" y1="190" x2="688" y2="190" stroke="#c4c4c4" stroke-width="1"/>
  <path d="M 604 205 L 644 205 L 644 168 L 686 168" fill="none" stroke="#b03a2e" stroke-width="2.5"/>
  <text x="644" y="252" font-size="13" fill="#555" text-anchor="middle">compare with zero</text>

  <!-- output -->
  <line x1="700" y1="185" x2="744" y2="185" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="752" y="190" font-size="14" fill="#2f3640">action</text>
  <text x="644" y="288" font-size="13" fill="#2f3640" text-anchor="middle">u &gt; 0  &#8594;  push right, action 1</text>
  <text x="644" y="308" font-size="13" fill="#2f3640" text-anchor="middle">otherwise  &#8594;  push left, action 0</text>

  <!-- equation -->
  <line x1="60" y1="352" x2="800" y2="352" stroke="#e2e2e2" stroke-width="1"/>
  <text x="292" y="388" font-size="18" fill="#2f3640" font-style="italic">u</text>
  <text x="308" y="388" font-size="18" fill="#2f3640" font-style="normal">=</text>
  <text x="332" y="388" font-size="18" fill="#2f3640" font-style="italic">w</text>
  <text x="345" y="393" font-size="12" fill="#2f3640" font-style="italic">1</text>
  <text x="354" y="388" font-size="18" fill="#2f3640" font-style="italic">x</text>
  <text x="372" y="388" font-size="18" fill="#2f3640" font-style="normal">+</text>
  <text x="388" y="388" font-size="18" fill="#2f3640" font-style="italic">w</text>
  <text x="401" y="393" font-size="12" fill="#2f3640" font-style="italic">2</text>
  <text x="410" y="388" font-size="18" fill="#2f3640" font-style="italic">x</text>
  <circle cx="413.5" cy="372" r="2.2" fill="#2f3640"/>
  <text x="429" y="388" font-size="18" fill="#2f3640" font-style="normal">+</text>
  <text x="445" y="388" font-size="18" fill="#2f3640" font-style="italic">w</text>
  <text x="458" y="393" font-size="12" fill="#2f3640" font-style="italic">3</text>
  <text x="467" y="388" font-size="18" fill="#2f3640" font-style="italic">&#952;</text>
  <text x="487" y="388" font-size="18" fill="#2f3640" font-style="normal">+</text>
  <text x="503" y="388" font-size="18" fill="#2f3640" font-style="italic">w</text>
  <text x="516" y="393" font-size="12" fill="#2f3640" font-style="italic">4</text>
  <text x="525" y="388" font-size="18" fill="#2f3640" font-style="italic">&#952;</text>
  <circle cx="529" cy="372" r="2.2" fill="#2f3640"/>
  <text x="545" y="388" font-size="18" fill="#2f3640" font-style="normal">+</text>
  <text x="561" y="388" font-size="18" fill="#2f3640" font-style="italic">b</text>
</svg>
