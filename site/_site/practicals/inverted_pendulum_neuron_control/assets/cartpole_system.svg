<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6e6e"/>
    </marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <!-- rail -->
  <line x1="70" y1="250" x2="650" y2="250" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="70" y1="238" x2="70" y2="262" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="650" y1="238" x2="650" y2="262" stroke="#3a3a3a" stroke-width="3"/>
  <text x="70" y="230" font-size="13" fill="#777" text-anchor="middle">&#8722;2.4 m</text>
  <text x="650" y="230" font-size="13" fill="#777" text-anchor="middle">+2.4 m</text>

  <!-- centre of the rail -->
  <line x1="360" y1="120" x2="360" y2="300" stroke="#c4c4c4" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="360" y="112" font-size="13" fill="#888" text-anchor="middle">centre of the rail</text>

  <!-- cart -->
  <rect x="385" y="212" width="90" height="38" rx="4" fill="#2f3640"/>
  <circle cx="408" cy="254" r="7" fill="#2f3640"/>
  <circle cx="452" cy="254" r="7" fill="#2f3640"/>

  <!-- pole -->
  <line x1="430" y1="212" x2="464.7" y2="82.6" stroke="#b5651d" stroke-width="10" stroke-linecap="round"/>
  <circle cx="430" cy="212" r="5.5" fill="#f7f7f7" stroke="#2f3640" stroke-width="2"/>
  <line x1="430" y1="212" x2="430" y2="70" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- pole angle -->
  <path d="M 430 142 A 70 70 0 0 1 448.1 144.4" fill="none" stroke="#0b6e6e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="466" y="146" font-size="19" fill="#0b6e6e" font-style="italic" text-anchor="middle">&#952;</text>
  <text x="480" y="146" font-size="13" fill="#0b6e6e">pole angle</text>

  <!-- angular velocity -->
  <path d="M 484 90 A 48 48 0 0 1 506 128" fill="none" stroke="#0b6e6e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="522" y="112" font-size="19" fill="#0b6e6e" font-style="italic" text-anchor="middle">&#952;</text>
  <circle cx="523" cy="95.5" r="2.1" fill="#0b6e6e"/>
  <text x="536" y="112" font-size="13" fill="#0b6e6e">angular velocity</text>

  <!-- cart velocity -->
  <line x1="487" y1="196" x2="548" y2="196" stroke="#0b6e6e" stroke-width="2" marker-end="url(#ah)"/>
  <text x="560" y="201" font-size="19" fill="#0b6e6e" font-style="italic" text-anchor="middle">x</text>
  <circle cx="562" cy="184.5" r="2.1" fill="#0b6e6e"/>
  <text x="573" y="201" font-size="13" fill="#0b6e6e">cart velocity</text>

  <!-- cart position -->
  <line x1="360" y1="250" x2="360" y2="296" stroke="#c4c4c4" stroke-width="1"/>
  <line x1="430" y1="258" x2="430" y2="296" stroke="#c4c4c4" stroke-width="1"/>
  <line x1="360" y1="286" x2="430" y2="286" stroke="#0b6e6e" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="380" y="309" font-size="19" fill="#0b6e6e" font-style="italic">x</text>
  <text x="394" y="309" font-size="13" fill="#0b6e6e">cart position</text>

  <!-- the two actions -->
  <line x1="382" y1="344" x2="302" y2="344" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ahf)"/>
  <line x1="478" y1="344" x2="558" y2="344" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ahf)"/>
  <text x="292" y="349" font-size="13" fill="#b03a2e" text-anchor="end">action 0, push left</text>
  <text x="568" y="349" font-size="13" fill="#b03a2e" text-anchor="start">action 1, push right</text>
  <text x="430" y="349" font-size="13" fill="#b03a2e" text-anchor="middle">10 N</text>
  <text x="430" y="378" font-size="13" fill="#888" text-anchor="middle">one push every 0.02 s</text>
</svg>
